name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'serve.mjs' ./ _site/
          touch _site/.nojekyll
          # assets/icons ve assets/photos için dosya listesi: sayfa yalnızca var olan görselleri ister
          for d in icons photos; do
            node -e "const fs=require('fs');const p='_site/assets/$d';const l=fs.existsSync(p)?fs.readdirSync(p).filter(f=>!f.startsWith('.')&&f!=='README.md'&&f!=='manifest.json'):[];fs.writeFileSync(p+'/manifest.json',JSON.stringify(l))"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
